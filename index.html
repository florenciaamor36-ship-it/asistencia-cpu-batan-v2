<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CPU Batán" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>CPU Batán — Control de Asistencia</title>
    <meta name="description" content="Sistema de control de asistencia, matrícula de alumnos y registro de trabajadores para CPU Batán." />
    <meta property="og:title" content="CPU Batán — Control de Asistencia" />
    <meta property="og:description" content="Sistema de control de asistencia, matrícula de alumnos y registro de trabajadores para CPU Batán." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isPublicDemo = new URLSearchParams(window.location.search).get('demo') === '1';
          if (isPublicDemo) {
            // Keep the public preview on fresh assets, never on a cached app shell.
            navigator.serviceWorker.getRegistrations().then(registrations =>
              Promise.all(registrations.map(registration => registration.unregister()))
            );
            if ('caches' in window) {
              caches.keys().then(keys => Promise.all(keys
                .filter(key => key.startsWith('cpu-batan-v'))
                .map(key => caches.delete(key))
              ));
            }
          } else {
            navigator.serviceWorker.register('./sw.js');
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
